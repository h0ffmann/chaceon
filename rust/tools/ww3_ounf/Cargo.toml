[package]
name = "ww3_ounf"
description = "WW3's gridded NetCDF postprocessor in Rust: reads mod_def.ww3 and out_grd.ww3, writes the NetCDF files"
license = "MPL-2.0"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ww3-host = { path = "../../crates/ww3-host" }
ww3-kernels = { path = "../../crates/ww3-kernels" }

# The binding to the system NetCDF C library (VERSIONS.md). Off by default, so `cargo check --workspace`
# and a build on a host without libnetcdf keep working; `scripts/rust_netcdf.sh` builds with it.
[features]
netcdf = []
