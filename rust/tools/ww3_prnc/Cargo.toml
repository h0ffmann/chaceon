[package]
name = "ww3_prnc"
description = "WW3's NetCDF forcing preprocessor in Rust: reads mod_def.ww3 and ww3_prnc.nml, writes wind.ww3, current.ww3, ice.ww3, ..."
license = "MPL-2.0"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ww3-host = { path = "../../crates/ww3-host" }

# The binding to the system NetCDF C library (VERSIONS.md) lives in ww3-host's ncread.rs. Off by default, so
# `cargo check --workspace` and a build on a host without libnetcdf keep working; `scripts/rust_netcdf.sh`
# builds with it.
[features]
netcdf = ["ww3-host/netcdf"]
