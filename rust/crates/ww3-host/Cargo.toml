[package]
name = "ww3-host"
description = "The parts of WW3 that run on the host: setup and tables"
license = "MPL-2.0"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ww3-kernels = { path = "../ww3-kernels" }
ww3-libm = { path = "../ww3-libm" }
# rsmpi binds the system MPI library through bindgen, so it stays out of the default build.
mpi = { version = "=0.8.0", optional = true, default-features = false }

[features]
mpi = ["dep:mpi"]
